name: "Sync GitHub stars with Raindrop"
on:
  schedule:
    # Runs once daily at midnight to sync stars
    - cron: "0 0 * * *"
    # Runs on the 1st of every month to keep the workflow active
    - cron: "0 0 1 * *"

jobs:
  build-and-run:
    # Runs on daily schedule
    if: github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Build
        run: npm run build

      - name: run script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          RAINDROP_COLLECTION_ID: ${{ secrets.RAINDROP_COLLECTION_ID }}
        run: node src/script.js

  keep-alive:
    # Runs on monthly schedule
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create empty commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Keep-alive commit to prevent workflow disabling"
          git push
